name: CI

on:
  push:
    branches: [main]
    # Installers are slow, so they're built only for these tags and manual runs.
    tags: ['build-*']
  workflow_dispatch:

# A newer push replaces runs of older pushes that haven't finished, so pushes can't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact_paths: target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-26.04
            bundles: deb,appimage
            artifact_paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test -p toolbox-core

      - name: Library checks (both systems)
        shell: bash
        run: |
          for e in check_pty check_hostkeys check_ftp check_serial check_keychain check_win_agent; do
            echo "== $e"
            cargo run -q -p toolbox-core --example "$e"
          done

      - name: Library checks (Linux, against a test SSH server and Docker)
        if: runner.os == 'Linux'
        run: |
          set -e
          cargo build -q -p toolbox-core --examples
          docker build -t toolbox-sshd tests/containers/sshd
          mkdir -p "$RUNNER_TEMP/keys"
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/keys/id_test"
          cp "$RUNNER_TEMP/keys/id_test.pub" "$RUNNER_TEMP/keys/authorized_keys"
          docker run -d --name sshd -p 127.0.0.1:2222:22 -v "$RUNNER_TEMP/keys:/keys:ro" -v /var/run/docker.sock:/var/run/docker.sock toolbox-sshd
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null && break
            sleep 1
          done
          eval "$(ssh-agent -s)"
          ssh-add "$RUNNER_TEMP/keys/id_test"
          export SSH_TEST_HOST=127.0.0.1 SSH_TEST_PORT=2222 SSH_TEST_USER=tester
          export SSH_TEST_PASSWORD=toolbox-test-only SSH_TEST_KEY="$RUNNER_TEMP/keys/id_test" SSH_TEST_AGENT=1
          cargo run -q -p toolbox-core --example check_ssh
          cargo run -q -p toolbox-core --example check_docker
          ssh-keyscan -p 2222 127.0.0.1 > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          SSH_TEST_KNOWN_HOSTS="$RUNNER_TEMP/known_hosts" cargo run -q -p toolbox-core --example check_docker_ssh
          docker rm -f sshd

      - name: Interface checks (types and import boundary)
        if: runner.os == 'Linux'
        run: npm run check

      - name: Interface tests
        if: runner.os == 'Linux'
        run: npm test

      - name: Interface build
        if: runner.os == 'Linux'
        run: npm run build

      - name: Build the app
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: ssh-toolbox-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  # The Mac app is only built when asked for (a manual run or a build tag). The checks that are the
  # same everywhere run on Linux; here only the Rust lint (which catches Mac-only warnings) and the build.
  macos:
    name: macOS
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # "-" signs the app with no identity, which is enough for Apple Silicon to open it after the
      # person allows it once. Without any signature macOS says the app is "damaged".
      - name: Build the app
        run: npx tauri build --bundles dmg

      # A double-click installer that puts the app in Applications, next to the disk image.
      - name: Make the installer package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          pkgbuild --component "target/release/bundle/macos/SSH Toolbox.app"             --install-location /Applications             --identifier "$(node -p "require('./src-tauri/tauri.conf.json').identifier")"             --version "$VERSION"             "target/release/bundle/dmg/SSH Toolbox_${VERSION}_aarch64.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-toolbox-macOS
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/*.pkg
          if-no-files-found: error

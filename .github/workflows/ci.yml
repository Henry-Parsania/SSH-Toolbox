name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact_paths: target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-26.04
            bundles: deb,appimage
            artifact_paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Rust format
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test -p toolbox-core

      - name: Interface checks (types and import boundary)
        run: npm run check

      - name: Interface tests
        run: npm test

      - name: Build the app
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-toolbox-${{ runner.os }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

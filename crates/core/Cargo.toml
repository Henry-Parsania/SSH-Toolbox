[package]
name = "toolbox-core"
version = "0.1.0"
description = "SSH Toolbox backend logic. Must not depend on Tauri."
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = "1.9"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
directories = "6.0.0"
toml = "0.9"
url = "2"
keyring-core = "1.0.1"
russh = { version = "=0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
bytes = "1"
rand = { version = "0.10", features = ["thread_rng"] }
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "test-util", "process"] }
russh-sftp = "3.0.1"
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
tokio-serial = "5.5.0"
bollard = "0.21.1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
